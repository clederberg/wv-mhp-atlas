<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SCH Properties · MHP Atlas</title>
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
  <header class="masthead">
    <div class="brand">
      <img class="logo" src="sch-logo.png" alt="SCH Properties LLC">
      <div class="brandtext">
        <h1>Mobile Home Park Atlas</h1>
        <div class="sub" id="sub">Monongalia County</div>
      </div>
    </div>
    <nav class="tabs">
      <a href="index.html" class="active">Table</a>
      <a href="map.html">Map</a>
    </nav>
  </header>

  <div id="banner"></div>

  <div class="controls">
    <input type="search" id="q" placeholder="Search owner, park name, address, parcel">
    <input type="search" id="state" list="states" placeholder="State" autocomplete="off">
    <datalist id="states"></datalist>
    <input type="search" id="county" list="counties" placeholder="County" autocomplete="off">
    <datalist id="counties"></datalist>
    <input type="search" id="city" list="cities" placeholder="Town" autocomplete="off">
    <datalist id="cities"></datalist>
    <input type="search" id="zip" list="zips" placeholder="ZIP" autocomplete="off">
    <datalist id="zips"></datalist>
    <button id="clear" type="button">Clear filters</button>
    <span class="count" id="count"></span>
  </div>

  <div class="tablewrap">
    <table id="tbl">
      <thead>
        <tr>
          <th data-k="park_name">Park <span class="arrow"></span></th>
          <th data-k="FullOwnerName">Owner <span class="arrow"></span></th>
          <th data-k="FullPhysicalAddress">Park address <span class="arrow"></span></th>
          <th data-k="city">Town <span class="arrow"></span></th>
          <th data-k="county">County <span class="arrow"></span></th>
          <th class="nowrap" data-k="zip">ZIP <span class="arrow"></span></th>
          <th class="num" data-k="lot_count">Lots <span class="arrow"></span></th>
        </tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
  </div>

  <p class="note" id="note"></p>
</div>

<script src="app.js"></script>
<script>
let PARKS = [];
let SHOWN = [];
let sortK = "lot_count", sortDir = -1;

function rowVal(p, k) {
  if (k === "deed") return deed(p);
  if (k === "county") return countyOf(p);
  if (k === "city") return cityOf(p);
  if (k === "zip") return zipOf(p);
  return p[k];
}

function render() {
  const q = document.getElementById("q").value.trim().toLowerCase();
  const fState = document.getElementById("state").value.trim().toLowerCase();
  const fCounty = document.getElementById("county").value.trim().toLowerCase();
  const fCity = document.getElementById("city").value.trim().toLowerCase();
  const fZip = document.getElementById("zip").value.trim().toLowerCase();
  const has = (val, field) => !val || (field || "").toLowerCase().includes(val);
  let rows = PARKS.filter(p => {
    if (!has(fState, stateOf(p))) return false;
    if (!has(fCounty, countyOf(p))) return false;
    if (!has(fCity, cityOf(p))) return false;
    if (!has(fZip, zipOf(p))) return false;
    if (!q) return true;
    return [p.park_name, p.FullOwnerName, p.FullPhysicalAddress, p.ParcelID, p.FullOwnerAddress,
            zipOf(p), cityOf(p), countyOf(p), p.edit_street]
      .some(v => (v || "").toLowerCase().includes(q));
  });
  rows.sort((a, b) => {
    let x = rowVal(a, sortK), y = rowVal(b, sortK);
    if (typeof x === "string" || typeof y === "string") {
      x = (x || "").toString().toLowerCase(); y = (y || "").toString().toLowerCase();
      return x < y ? -sortDir : x > y ? sortDir : 0;
    }
    return ((x || 0) - (y || 0)) * sortDir;
  });

  SHOWN = rows;
  const tb = document.getElementById("rows");
  tb.innerHTML = "";
  rows.forEach((p, i) => {
    const tr = document.createElement("tr");
    tr.dataset.i = i;
    tr.innerHTML = `
      <td class="parkname">${p.park_name ? p.park_name : "<span class='muted'>&mdash;</span>"}</td>
      <td class="owner col-owner">${p.FullOwnerName || ""}</td>
      <td class="col-addr">${displayAddress(p)}</td>
      <td class="col-town">${cityOf(p)}</td>
      <td class="col-county">${countyOf(p)}</td>
      <td class="num nowrap col-zip">${zipOf(p) || "<span class='muted'>&mdash;</span>"}</td>
      <td class="num col-lots">${num(p.lot_count)}</td>`;
    tb.appendChild(tr);
  });
  document.getElementById("count").textContent =
    `${rows.length} park${rows.length === 1 ? "" : "s"}`;
  markArrows();
}

function markArrows() {
  document.querySelectorAll("thead th").forEach(th => {
    const a = th.querySelector(".arrow");
    a.textContent = th.dataset.k === sortK ? (sortDir === 1 ? "\u25b2" : "\u25bc") : "";
  });
}

document.querySelectorAll("thead th").forEach(th => {
  th.addEventListener("click", () => {
    const k = th.dataset.k;
    if (k === sortK) sortDir *= -1;
    else { sortK = k; sortDir = (["park_name", "FullOwnerName", "FullPhysicalAddress", "city", "county", "zip"].includes(k)) ? 1 : -1; }
    render();
  });
});
document.getElementById("q").addEventListener("input", render);
["state", "county", "city", "zip"].forEach(id =>
  document.getElementById(id).addEventListener("input", render));
document.getElementById("clear").addEventListener("click", () => {
  ["q", "state", "county", "city", "zip"].forEach(id => (document.getElementById(id).value = ""));
  render();
});

document.getElementById("rows").addEventListener("click", (e) => {
  if (e.target.closest("a")) return;        // let the deed link do its thing
  const tr = e.target.closest("tr");
  if (!tr || tr.dataset.i === undefined) return;
  const p = SHOWN[+tr.dataset.i];
  if (p) openDetail(p);
});
document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeDetail(); });

function fillList(datalistId, values) {
  const dl = document.getElementById(datalistId);
  values.filter(Boolean).sort().forEach(v => {
    const o = document.createElement("option");
    o.value = v;
    dl.appendChild(o);
  });
}

function fillFilters() {
  fillList("states", [...new Set(PARKS.map(stateOf))]);
  fillList("counties", [...new Set(PARKS.map(countyOf))]);
  fillList("cities", [...new Set(PARKS.map(cityOf))]);
  fillList("zips", [...new Set(PARKS.map(zipOf))]);
}

loadParks().then(fc => {
  PARKS = fc.features.map(f => f.properties);
  fillFilters();
  if (fc.meta) document.getElementById("sub").textContent =
    `${fc.meta.county || ""} County  \u00b7  built ${fc.meta.built || ""}`;
  if (isSample(fc)) document.getElementById("banner").innerHTML =
    `<div class="sample-banner">Sample data. Run <code>python fetch.py</code> to replace this with live Monongalia parcels.</div>`;
  document.getElementById("note").textContent =
    "Click any park for full details. Parks spanning multiple parcels are combined into one row, with lots and values summed. Lots = E-911 address points unless a verified count has been entered. Assessed values, deed/clerk lookup, and parcels are in each park's detail panel.";
  render();
}).catch(e => {
  document.getElementById("rows").innerHTML =
    `<tr><td colspan="7">Could not load parks.geojson. ${e.message}</td></tr>`;
});
</script>
</body>
</html>
