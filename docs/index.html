<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SCH Properties · MHP Atlas</title>
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
  <header class="masthead">
    <div class="brand">
      <img class="logo" src="sch-logo.png" alt="SCH Properties LLC">
      <div class="brandtext">
        <h1>Mobile Home Park Atlas</h1>
        <div class="sub" id="sub">Monongalia County</div>
      </div>
    </div>
    <nav class="tabs">
      <a href="index.html" class="active">Table</a>
      <a href="map.html">Map</a>
    </nav>
  </header>

  <div id="banner"></div>

  <div class="controls">
    <input type="search" id="q" placeholder="Filter by owner, address, ZIP, or parcel id">
    <select id="zip"><option value="">All ZIPs</option></select>
    <span class="count" id="count"></span>
  </div>

  <div class="tablewrap">
    <table id="tbl">
      <thead>
        <tr>
          <th data-k="park_name">Park <span class="arrow"></span></th>
          <th data-k="FullOwnerName">Owner <span class="arrow"></span></th>
          <th data-k="FullPhysicalAddress">Park address <span class="arrow"></span></th>
          <th class="num" data-k="lot_count">Lots <span class="arrow"></span></th>
          <th class="num" data-k="TotalAppraisal">Assessed <span class="arrow"></span></th>
          <th class="num" data-k="est_market_value">Est. market <span class="arrow"></span></th>
          <th class="nowrap" data-k="deed">Last transfer <span class="arrow"></span></th>
          <th data-k="recent_transfer">Status <span class="arrow"></span></th>
          <th class="nowrap" data-k="ParcelID">Parcel <span class="arrow"></span></th>
        </tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
  </div>

  <p class="note" id="note"></p>
</div>

<script src="app.js"></script>
<script>
let PARKS = [];
let SHOWN = [];
let sortK = "lot_count", sortDir = -1;

// ---- Edit form wiring -----------------------------------------------------
// After you create your Google Form, paste its "viewform" link into FORM_URL.
// To pre-fill the park onto the form, use Google's "Get pre-filled link" on the
// Parcel and Park-name questions, and copy the entry.NNNN numbers here.
const FORM_URL = "https://docs.google.com/forms/d/e/1FAIpQLSfHyZgntXrETDo_iQmMaYgLak6pk2fsDjEGSKnbWIMleX-wwQ/viewform";
const FORM_PARCEL_ENTRY = "1225674373";   // the entry number for the "Parcel ID" question
const FORM_NAME_ENTRY = "244410246";      // the entry number for the "Park name" question

function editUrl(p) {
  if (!FORM_URL) return "";
  let u = FORM_URL + (FORM_URL.includes("?") ? "&" : "?") + "usp=pp_url";
  if (FORM_PARCEL_ENTRY) u += "&entry." + FORM_PARCEL_ENTRY + "=" + encodeURIComponent(p.ParcelID || "");
  if (FORM_NAME_ENTRY) u += "&entry." + FORM_NAME_ENTRY + "=" + encodeURIComponent(p.park_name || "");
  return u;
}

function _kv(k, v) {
  return `<div class="k">${k}</div><div class="v">${v || "<span class='muted'>&mdash;</span>"}</div>`;
}

function openDetail(p) {
  const ov = document.createElement("div");
  ov.className = "detail-overlay";
  ov.onclick = (e) => { if (e.target === ov) closeDetail(); };

  const parcels = (p.parcels || []).map(x =>
    `<div class="detail-parcel"><b>${x.ParcelID || ""}</b> &nbsp; ${num(x.lot_count)} lots &nbsp; ${money(x.TotalAppraisal)}<div class="addr">${x.FullPhysicalAddress || ""}</div></div>`
  ).join("");

  const deedHtml = deed(p)
    ? `<a href="https://searchrecords.monongaliacountyclerk.com/" target="_blank" rel="noopener" onclick="copyBook('${(p.DeedBook || '').trim()}')">${deed(p)}</a> <span class="addr">(opens clerk search, copies book #)</span>`
    : "<span class='muted'>&mdash;</span>";

  const eu = editUrl(p);
  const editBtn = eu
    ? `<a class="detail-edit" href="${eu}" target="_blank" rel="noopener">Edit / add details</a>`
    : `<button class="detail-edit" onclick="toast('Add your Google Form link in index.html (FORM_URL) to enable editing')">Edit / add details</button>`;

  const fmtRent = (v) => { v = ("" + v).trim(); return /^\d+(\.\d+)?$/.test(v) ? "$" + v : v; };
  const ed = [];
  if (p.rent_single) ed.push(_kv("Single-wide rent", fmtRent(p.rent_single)));
  if (p.rent_double) ed.push(_kv("Double-wide rent", fmtRent(p.rent_double)));
  if (p.count_park_owned) ed.push(_kv("Park-owned homes", p.count_park_owned));
  if (p.count_rv) ed.push(_kv("RV sites", p.count_rv));
  if (p.count_sfh) ed.push(_kv("Single-family homes", p.count_sfh));
  if (p.count_other) ed.push(_kv("Other", p.count_other));
  const edSec = (ed.length || p.notes)
    ? `<div class="detail-sec"><h3>Operating details ${p.edited_at ? `<span class="addr" style="text-transform:none;font-weight:400">\u00b7 edited ${String(p.edited_at).split(" ")[0]}</span>` : ""}</h3>
        ${ed.length ? `<div class="detail-grid">${ed.join("")}</div>` : ""}
        ${p.notes ? `<div class="addr" style="margin-top:8px">${p.notes}</div>` : ""}</div>`
    : "";

  ov.innerHTML = `<div class="detail-panel">
    <a class="detail-close" onclick="closeDetail()">&times;</a>
    <h2>${p.park_name || "Unnamed park"}</h2>
    <div class="detail-owner">${p.FullOwnerName || ""}</div>
    <div class="detail-grid">
      ${_kv(p.lot_count_verified ? "Lots (verified)" : "Lots (E-911)", num(p.lot_count))}
      ${_kv("Parcels", p.parcel_count || 1)}
      ${_kv("Assessed", money(p.TotalAppraisal))}
      ${_kv("Est. market", money(p.est_market_value))}
      ${_kv("Acres", p.DeededAcres || "")}
      ${_kv("Class", p.PropertyClassDescription || "")}
      ${_kv("Tax year", p.TaxYear || "")}
      ${_kv("Name source", p.name_source || "")}
    </div>
    <div class="detail-sec">
      <h3>Location ${p.address_verified ? '<span class="addr" style="text-transform:none;font-weight:400">\u00b7 verified</span>' : ''}</h3>
      <div>${displayAddress(p)}</div>
      ${p.address_verified ? `<div class="addr">Assessor: ${addressWithZip(p)}</div>` : ''}
      <div class="addr">Owner mailing: ${p.FullOwnerAddress || "&mdash;"}</div>
    </div>
    <div class="detail-sec">
      <h3>Last transfer</h3>
      <div>${deedHtml}</div>
      ${p.recent_transfer ? `<div class="addr">Transfer pending to ${p.NewOwner || ""}</div>` : ""}
    </div>
    ${parcels ? `<div class="detail-sec"><h3>Parcels in this park</h3>${parcels}</div>` : ""}
    ${edSec}
    <div class="detail-sec" style="border:none">${editBtn}</div>
  </div>`;
  document.body.appendChild(ov);
  document.body.style.overflow = "hidden";
}

function closeDetail() {
  const ov = document.querySelector(".detail-overlay");
  if (ov) ov.remove();
  document.body.style.overflow = "";
}

function copyBook(book) {
  if (!book) return;
  try { navigator.clipboard.writeText(book); } catch (e) { /* ignore */ }
  toast(`Book ${book} copied \u2014 paste into Book #`);
}

function toast(msg) {
  let t = document.getElementById("atlas-toast");
  if (!t) {
    t = document.createElement("div");
    t.id = "atlas-toast";
    t.style.cssText = "position:fixed;bottom:18px;left:50%;transform:translateX(-50%);" +
      "background:#1e4a24;color:#fff;padding:9px 16px;border-radius:8px;font-size:13px;" +
      "font-family:Lato,sans-serif;z-index:9999;box-shadow:0 4px 14px rgba(0,0,0,.2);" +
      "opacity:0;transition:opacity .15s";
    document.body.appendChild(t);
  }
  t.textContent = msg;
  t.style.opacity = "1";
  clearTimeout(t._h);
  t._h = setTimeout(() => { t.style.opacity = "0"; }, 2200);
}

function rowVal(p, k) {
  if (k === "deed") return deed(p);
  return p[k];
}

function render() {
  const q = document.getElementById("q").value.trim().toLowerCase();
  const zipSel = document.getElementById("zip").value;
  let rows = PARKS.filter(p => {
    if (zipSel && zipOf(p) !== zipSel) return false;
    if (!q) return true;
    return [p.park_name, p.FullOwnerName, p.FullPhysicalAddress, p.ParcelID, p.FullOwnerAddress,
            zipOf(p), p.edit_street, p.edit_city, p.edit_state]
      .some(v => (v || "").toLowerCase().includes(q));
  });
  rows.sort((a, b) => {
    let x = rowVal(a, sortK), y = rowVal(b, sortK);
    if (typeof x === "string" || typeof y === "string") {
      x = (x || "").toString().toLowerCase(); y = (y || "").toString().toLowerCase();
      return x < y ? -sortDir : x > y ? sortDir : 0;
    }
    return ((x || 0) - (y || 0)) * sortDir;
  });

  SHOWN = rows;
  const tb = document.getElementById("rows");
  tb.innerHTML = "";
  rows.forEach((p, i) => {
    const tr = document.createElement("tr");
    tr.dataset.i = i;
    const status = p.recent_transfer
      ? `<span class="flag">transfer pending</span>`
      : "";
    tr.innerHTML = `
      <td class="parkname">${p.park_name ? p.park_name : "<span class='muted'>&mdash;</span>"}</td>
      <td class="owner">${p.FullOwnerName || ""}</td>
      <td>${displayAddress(p)}<div class="addr">${p.FullOwnerAddress || ""}</div></td>
      <td class="num">${num(p.lot_count)}</td>
      <td class="num">${money(p.TotalAppraisal)}</td>
      <td class="num">${money(p.est_market_value)}</td>
      <td class="num nowrap">${deed(p)
        ? `<a href="https://searchrecords.monongaliacountyclerk.com/" target="_blank" rel="noopener" onclick="copyBook('${(p.DeedBook || '').trim()}')" title="Opens the Monongalia County Clerk search and copies the book number (${(p.DeedBook || '').trim()}) to your clipboard. Paste into Book #, then type the page.">${deed(p)}</a>`
        : "<span class='muted'>&mdash;</span>"}</td>
      <td>${status}${p.recent_transfer ? "<div class='addr'>to " + (p.NewOwner || "") + "</div>" : ""}</td>
      <td class="nowrap">${p.parcel_count > 1 ? p.parcel_count + " parcels" : (p.ParcelID || "")}</td>`;
    tb.appendChild(tr);
  });
  document.getElementById("count").textContent =
    `${rows.length} park${rows.length === 1 ? "" : "s"}`;
  markArrows();
}

function markArrows() {
  document.querySelectorAll("thead th").forEach(th => {
    const a = th.querySelector(".arrow");
    a.textContent = th.dataset.k === sortK ? (sortDir === 1 ? "\u25b2" : "\u25bc") : "";
  });
}

document.querySelectorAll("thead th").forEach(th => {
  th.addEventListener("click", () => {
    const k = th.dataset.k;
    if (k === sortK) sortDir *= -1;
    else { sortK = k; sortDir = (k === "park_name" || k === "FullOwnerName" || k === "FullPhysicalAddress") ? 1 : -1; }
    render();
  });
});
document.getElementById("q").addEventListener("input", render);
document.getElementById("zip").addEventListener("change", render);

document.getElementById("rows").addEventListener("click", (e) => {
  if (e.target.closest("a")) return;        // let the deed link do its thing
  const tr = e.target.closest("tr");
  if (!tr || tr.dataset.i === undefined) return;
  const p = SHOWN[+tr.dataset.i];
  if (p) openDetail(p);
});
document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeDetail(); });

function fillZips() {
  const zips = [...new Set(PARKS.map(zipOf).filter(Boolean))].sort();
  const sel = document.getElementById("zip");
  for (const z of zips) {
    const o = document.createElement("option");
    o.value = z; o.textContent = z;
    sel.appendChild(o);
  }
}

loadParks().then(fc => {
  PARKS = fc.features.map(f => f.properties);
  fillZips();
  if (fc.meta) document.getElementById("sub").textContent =
    `${fc.meta.county || ""} County  \u00b7  built ${fc.meta.built || ""}`;
  if (isSample(fc)) document.getElementById("banner").innerHTML =
    `<div class="sample-banner">Sample data. Run <code>python fetch.py</code> to replace this with live Monongalia parcels.</div>`;
  document.getElementById("note").textContent =
    "Parks spanning multiple parcels are combined into one row, with lots, acreage, and values summed. Est. market = assessed / 0.6 (WV assesses at 60% of appraised value). Lots = E-911 address points inside the parcel. Last transfer shows the recorded deed reference; the assessor feed carries no sale date or price (those require a county clerk lookup).";
  render();
}).catch(e => {
  document.getElementById("rows").innerHTML =
    `<tr><td colspan="9">Could not load parks.geojson. ${e.message}</td></tr>`;
});
</script>
</body>
</html>
