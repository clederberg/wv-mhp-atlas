name: Build MHP data

# Lets you run it by hand (a "Run workflow" button) and also monthly.
on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 1 * *"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Prints every land-use label in the county into the run log,
      # so if the park filter misses anything you can see the real names.
      - name: List land-use labels
        run: python fetch.py --discover || true

      - name: Fetch parks
        run: python fetch.py --county MONONGALIA

      - name: Commit data
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add docs/parks.geojson docs/parks.csv
          git commit -m "Update MHP data" || echo "no changes to commit"
          git push
